<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Track the books you want to read, are reading, and have finished.">
  <meta name="color-scheme" content="light dark">
  <title>Book Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="container">
      <h1>Book Tracker</h1>
      <p class="tagline">Keep track of what you want to read, what you're reading, and what you've finished.</p>
    </div>
  </header>

  <main id="main" class="container">
    <p id="storage-warning" class="banner" role="alert" hidden>
      Your changes can't be saved in this browser, so they'll be lost when you close or refresh the page.
    </p>

    <div class="layout">
    <!-- Add a book -->
    <section class="panel" aria-labelledby="add-heading">
      <h2 id="add-heading">Add a book</h2>
      <p class="panel-hint muted">Both title and author are required.</p>
      <form id="book-form" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input id="title" name="title" type="text" maxlength="150" autocomplete="off" placeholder="e.g. The Left Hand of Darkness"
                 required aria-describedby="title-error">
          <p id="title-error" class="error" hidden></p>
        </div>

        <div class="field">
          <label for="author">Author</label>
          <input id="author" name="author" type="text" maxlength="100" autocomplete="off" placeholder="e.g. Ursula K. Le Guin"
                 required aria-describedby="author-error">
          <p id="author-error" class="error" hidden></p>
        </div>

        <div class="field">
          <label for="status">Status</label>
          <select id="status" name="status"></select>
        </div>

        <button type="submit" class="btn btn-primary">Add book</button>
      </form>
    </section>

    <!-- Status counts (also act as filters) -->
    <section aria-labelledby="summary-heading">
      <h2 id="summary-heading" class="visually-hidden">Reading summary</h2>
      <div class="stats" role="group" aria-label="Filter books by status">
        <button type="button" class="stat" data-filter="all" aria-pressed="true">
          <span class="stat-count" data-count="all">0</span>
          <span class="stat-label">All books</span>
        </button>
        <button type="button" class="stat" data-filter="to-read" data-status="to-read" aria-pressed="false">
          <span class="stat-count" data-count="to-read">0</span>
          <span class="stat-label">To read</span>
        </button>
        <button type="button" class="stat" data-filter="reading" data-status="reading" aria-pressed="false">
          <span class="stat-count" data-count="reading">0</span>
          <span class="stat-label">Reading</span>
        </button>
        <button type="button" class="stat" data-filter="finished" data-status="finished" aria-pressed="false">
          <span class="stat-count" data-count="finished">0</span>
          <span class="stat-label">Finished</span>
        </button>
      </div>
    </section>

    <!-- Library -->
    <section class="library" aria-labelledby="library-heading">
      <div class="library-head">
        <h2 id="library-heading" tabindex="-1">Your books</h2>
        <p id="result-summary" class="muted" role="status"></p>
      </div>

      <div class="field search">
        <label for="search">Search by title or author</label>
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="search" type="search" autocomplete="off" placeholder="Search your books">
          <button type="button" id="search-clear" class="search-clear" aria-label="Clear search" hidden>
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" focusable="false"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <ul id="book-list" class="book-list"></ul>

      <div id="empty-state" class="empty" hidden>
        <svg class="empty-icon" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true" focusable="false"><rect x="8" y="8" width="9" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/><rect x="20" y="8" width="9" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M33 12.5l7.5 2.2-8 25.6-7.4-2.3" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>
        <h3 id="empty-title"></h3>
        <p id="empty-text" class="muted"></p>
        <button type="button" id="empty-add" class="btn btn-primary" hidden>Add your first book</button>
        <button type="button" id="empty-reset" class="btn btn-secondary" hidden>Clear search and filter</button>
      </div>
    </section>
    </div>
  </main>

  <!-- Screen-reader announcements for actions (add, update, delete) -->
  <p id="status-message" class="visually-hidden" role="status" aria-live="polite"></p>

  <template id="book-template">
    <li class="book">
      <div class="book-cover" aria-hidden="true"></div>
      <div class="book-info">
        <h3 class="book-title"></h3>
        <p class="book-author"></p>
        <span class="badge"></span>
      </div>
      <div class="book-actions">
        <select class="status-select"></select>
        <button type="button" class="btn btn-danger delete-btn">Delete</button>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
